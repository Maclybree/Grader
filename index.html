<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>GRADER</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#F8FAFC;--surface:#FFFFFF;--primary:#2563EB;--text:#0F172A;--muted:#64748B;--border:#E2E8F0;--success:#16A34A;--danger:#DC2626}
  *{font-family:'Inter',sans-serif;margin:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text)}
  .hidden{display:none}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px}
  .btn{background:var(--primary);color:white;border:0;padding:10px 20px;border-radius:8px;font-weight:600;cursor:pointer}
  .btn:hover{background:#1D4ED8}
  .input{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;margin-bottom:12px}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" style="display:flex;align-items:center;justify-content:center;height:100vh">
  <div class="card" style="width:400px">
    <h1 style="font-size:28px;font-weight:700">GRADER</h1>
    <p style="color:var(--muted);margin-bottom:20px">School Marks Management</p>
    <input id="user" class="input" placeholder="Username" value="admin">
    <input id="pass" class="input" type="password" placeholder="Password" value="password">
    <button class="btn" style="width:100%" onclick="login()">Sign in</button>
    <p id="err" class="hidden" style="color:var(--danger);margin-top:10px">Wrong username or password</p>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden" style="display:flex">
  <div style="width:240px;background:var(--surface);border-right:1px solid var(--border);height:100vh;padding:16px">
    <h2 style="font-weight:700;font-size:24px;margin-bottom:30px">GRADER</h2>
    <div style="color:var(--muted);font-size:12px;font-weight:600;margin:10px 0">ACADEMIC</div>
    <div onclick="show('dash')" style="padding:8px 12px;border-radius:8px;cursor:pointer" id="nav-dash">Dashboard</div>
    <div onclick="show('marks')" style="padding:8px 12px;border-radius:8px;cursor:pointer" id="nav-marks">Enter Marks</div>
  </div>

  <div style="flex:1;padding:32px">
    <!-- DASHBOARD -->
    <div id="dash">
      <h2 style="font-size:24px;font-weight:600">Good morning, Sekonyela</h2>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:20px">
        <div class="card"><p style="color:var(--muted)">Students</p><p style="font-size:32px;font-weight:700">4</p></div>
        <div class="card"><p style="color:var(--muted)">Teachers</p><p style="font-size:32px;font-weight:700">1</p></div>
        <div class="card"><p style="color:var(--muted)">Classes</p><p style="font-size:32px;font-weight:700">1</p></div>
        <div class="card"><p style="color:var(--muted)">Assessments</p><p style="font-size:32px;font-weight:700">1</p></div>
      </div>
    </div>

    <!-- MARKS -->
    <div id="marks" class="hidden">
      <h2 style="font-size:24px;font-weight:600">Grade 8A | Mathematics Test 1</h2>
      <p style="color:var(--muted)">Max Mark: 50</p>
      <p id="count" style="margin:16px 0">3 of 4 completed</p>
      <div class="card" style="padding:0">
        <table style="width:100%">
          <tr style="background:var(--bg)"><th style="text-align:left;padding:12px">Student</th><th style="text-align:left;padding:12px">Mark</th><th style="text-align:left;padding:12px">Status</th></tr>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <button class="btn" style="margin-top:16px" onclick="save()">Save Changes</button>
      <p id="saved" class="hidden" style="color:var(--success);margin-top:10px">✓ Marks saved successfully</p>
    </div>
  </div>
</div>

<script>
const students=[
  {name:'Thabo Mokoena',mark:'42'},
  {name:'Lerato Nkosi',mark:'38'},
  {name:'Neo Radebe',mark:'45'},
  {name:'Mpho Tau',mark:''}
]

function login(){
  if(document.getElementById('user').value==='admin' && document.getElementById('pass').value==='password'){
    document.getElementById('login').classList.add('hidden')
    document.getElementById('app').classList.remove('hidden')
    render()
  }else{
    document.getElementById('err').classList.remove('hidden')
  }
}

function show(page){
  document.getElementById('dash').classList.add('hidden')
  document.getElementById('marks').classList.add('hidden')
  document.getElementById(page).classList.remove('hidden')
  document.getElementById('nav-dash').style.background=''
  document.getElementById('nav-marks').style.background=''
  document.getElementById('nav-'+page).style.background='#EFF6FF'
}

function render(){
  let html=''
  let completed=0
  students.forEach((s,i)=>{
    if(s.mark!=='')completed++
    html+=`<tr>
      <td style="padding:12px;border-top:1px solid var(--border)">${s.name}</td>
      <td style="padding:12px;border-top:1px solid var(--border)">
        <input value="${s.mark}" oninput="students[${i}].mark=this.value;render()" 
        style="width:80px;padding:6px;border:1px solid var(--border);border-radius:6px">
      </td>
      <td style="padding:12px;border-top:1px solid var(--border);color:${s.mark?'var(--success)':'var(--danger)'}">
        ${s.mark?'✓ Saved':'! Missing'}
      </td>
    </tr>`
  })
  document.getElementById('tbody').innerHTML=html
  document.getElementById('count').innerText=`${completed} of ${students.length} completed`
}

function save(){
  document.getElementById('saved').classList.remove('hidden')
  setTimeout(()=>document.getElementById('saved').classList.add('hidden'),2000)
}
</script>
</body>
</html>
