<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GRADER - Academic Command</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F8FAFC; --surface:#FFFFFF; --primary:#2563EB; --primary-hover:#1D4ED8;
  --text:#0F172A; --muted:#64748B; --border:#E2E8F0; --success:#16A34A; 
  --warning:#D97706; --danger:#DC2626; --radius:12px;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
body{background:var(--bg);color:var(--text);font-size:14px;}
.hidden{display:none !important;}

/* LAYOUT ORDER 23 */
.app{display:flex;min-height:100vh;}
.sidebar{width:240px;background:var(--surface);border-right:1px solid var(--border);padding:16px;position:fixed;height:100vh;display:flex;flex-direction:column;}
.sidebar h1{font-size:24px;font-weight:700;margin-bottom:32px;letter-spacing:-0.5px;}
.nav-group{color:var(--muted);font-size:12px;font-weight:600;margin:16px 0 8px 12px;text-transform:uppercase;letter-spacing:0.5px;}
.nav-item{padding:10px 12px;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500;margin-bottom:2px;display:flex;align-items:center;gap:8px;}
.nav-item:hover{background:#F1F5F9;}
.nav-item.active{background:#EFF6FF;color:var(--primary);}
.sidebar-footer{margin-top:auto;padding-top:16px;border-top:1px solid var(--border);}
.main{margin-left:240px;flex:1;padding:32px;}

/* COMPONENTS ORDER 27 */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;box-shadow:0 1px 2px rgba(0,0,0,0.04);}
.btn{background:var(--primary);color:white;border:none;padding:10px 16px;border-radius:8px;font-weight:600;cursor:pointer;font-size:14px;}
.btn:hover{background:var(--primary-hover);}
.btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border);}
.input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;}
.input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 1px var(--primary);}

/* TYPOGRAPHY ORDER 26 */
h1{font-size:28px;font-weight:600;}
h2{font-size:20px;font-weight:600;}
.label{font-size:13px;font-weight:500;color:var(--muted);}

/* LOGIN ORDER 28 */
#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;}
.login-card{width:420px}

/* DASHBOARD ORDER 22, 29 */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:24px 0;}
.stat-card .value{font-size:32px;font-weight:700;margin-top:4px;}

/* TABLES ORDER 31 */
.table-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;}
table{width:100%;border-collapse:collapse;}
th{text-align:left;padding:12px 16px;font-size:13px;font-weight:600;color:var(--muted);background:var(--bg);border-bottom:1px solid var(--border);}
td{padding:12px 16px;border-bottom:1px solid var(--border);}
tr:last-child td{border-bottom:none;}

/* MARK ENTRY ORDER 15, 16, 30 */
.mark-input{width:80px;padding:8px;border:1px solid var(--border);border-radius:8px;text-align:center;font-weight:600;}
.mark-input:focus{border-color:var(--primary);}
.status{font-size:13px;font-weight:500;}
.status.saved{color:var(--success);}
.status.missing{color:var(--danger);}
.feedback{margin-top:12px;font-weight:500;}

/* RESPONSIVE ORDER 24 */
@media(max-width:768px){
  .sidebar{transform:translateX(-100%);position:fixed;z-index:50}
  .main{margin-left:0}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<!-- ORDER 28: LOGIN -->
<div id="login-screen">
  <div class="card login-card">
    <h1>GRADER</h1>
    <p class="label" style="margin-bottom:24px">School Marks Management</p>
    <input id="email" class="input" placeholder="Email" value="admin@school.ls">
    <input id="password" class="input" type="password" placeholder="Password" value="password">
    <button class="btn" style="width:100%" onclick="login()">Sign in</button>
    <p id="login-error" class="label" style="color:var(--danger);margin-top:12px" class="hidden"></p>
  </div>
</div>

<!-- ORDER 23: APP LAYOUT -->
<div id="app-screen" class="app hidden">
  <div class="sidebar">
    <h1>GRADER</h1>
    <div id="nav-admin">
      <div class="nav-group">ACADEMIC</div>
      <div class="nav-item active" onclick="route('admin')">Dashboard</div>
      <div class="nav-item" onclick="route('classes')">Classes</div>
      <div class="nav-item" onclick="route('students')">Students</div>
      <div class="nav-item" onclick="route('subjects')">Subjects</div>
      <div class="nav-item" onclick="route('assessments')">Assessments</div>
      <div class="nav-group">MARKS</div>
      <div class="nav-item" onclick="route('history')">History</div>
      <div class="nav-group">ADMIN</div>
      <div class="nav-item" onclick="route('users')">Users</div>
      <div class="nav-item" onclick="route('assignments')">Assignments</div>
    </div>
    <div id="nav-teacher" class="hidden">
      <div class="nav-group">MY TEACHING</div>
      <div class="nav-item active" onclick="route('teacher')">Dashboard</div>
      <div class="nav-item" onclick="route('teacher-classes')">Classes</div>
      <div class="nav-item" onclick="route('teacher-assessments')">Assessments</div>
      <div class="nav-group">MARKS</div>
      <div class="nav-item" onclick="route('marks')">Enter Marks</div>
      <div class="nav-item" onclick="route('teacher-history')">History</div>
    </div>
    <div class="sidebar-footer">
      <div style="font-weight:600" id="user-name">Sekonyela Sentle</div>
      <div class="label" id="user-role">admin</div>
      <div class="label" style="cursor:pointer;margin-top:8px" onclick="logout()">Log out</div>
    </div>
  </div>

  <div class="main" id="main-content"></div>
</div>

<script>
// FAKE DB - ORDER 3. REPLACE WITH SUPABASE LATER
const DB = {
  user: {id:1, name:'Sekonyela Sentle', role:'admin', email:'admin@school.ls'},
  classes: [{id:1,name:'Grade 8A'}],
  students: [
    {id:1,name:'Thabo Mokoena',class_id:1,active:true},
    {id:2,name:'Lerato Nkosi',class_id:1,active:true},
    {id:3,name:'Neo Radebe',class_id:1,active:true},
    {id:4,name:'Mpho Tau',class_id:1,active:true}
  ],
  subjects: [{id:1,name:'Mathematics'}],
  assessments: [{id:1,name:'Mathematics Test 1',class_id:1,subject_id:1,maximum_mark:50,date:'2026-08-28'}],
  marks: [
    {id:1,student_id:1,assessment_id:1,mark:42},
    {id:2,student_id:2,assessment_id:1,mark:38},
    {id:3,student_id:3,assessment_id:1,mark:45}
  ],
  audit: []
}

// ORDER 4,5: AUTH
function login(){
  const email = document.getElementById('email').value
  const pass = document.getElementById('password').value
  if(email && pass){
    document.getElementById('login-screen').classList.add('hidden')
    document.getElementById('app-screen').classList.remove('hidden')
    if(DB.user.role==='teacher') {
      document.getElementById('nav-admin').classList.add('hidden')
      document.getElementById('nav-teacher').classList.remove('hidden')
    }
    route(DB.user.role==='admin' ? 'admin' : 'teacher')
  } else {
    document.getElementById('login-error').innerText='Invalid credentials'
  }
}
function logout(){
  document.getElementById('app-screen').classList.add('hidden')
  document.getElementById('login-screen').classList.remove('hidden')
}

// ORDER 6: ROUTING
function route(page){
  document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'))
  event?.target?.classList.add('active')
  const main = document.getElementById('main-content')
  
  if(page==='admin') main.innerHTML = AdminDashboard() // ORDER 22
  if(page==='teacher') main.innerHTML = TeacherDashboard() // ORDER 14,29
  if(page==='marks') main.innerHTML = MarkEntry() // ORDER 15,30
  if(page==='students') main.innerHTML = StudentsTable() // ORDER 9,31
  if(page==='assessments') main.innerHTML = AssessmentsTable() // ORDER 13
  if(page==='history') main.innerHTML = AuditHistory() // ORDER 20
}

// ORDER 22: ADMIN DASHBOARD
function AdminDashboard(){
  return `
  <h1>Good morning, ${DB.user.name}</h1>
  <div class="stats-grid">
    <div class="card stat-card"><div class="label">Students</div><div class="value">${DB.students.length}</div></div>
    <div class="card stat-card"><div class="label">Teachers</div><div class="value">1</div></div>
    <div class="card stat-card"><div class="label">Classes</div><div class="value">${DB.classes.length}</div></div>
    <div class="card stat-card"><div class="label">Active Assessments</div><div class="value">${DB.assessments.length}</div></div>
  </div>
  <div class="card"><h2>Recent Activity</h2><p class="label">No recent activity</p></div>
  `
}

// ORDER 29: TEACHER DASHBOARD
function TeacherDashboard(){
  return `
  <h1>Good morning, ${DB.user.name}</h1>
  <div class="stats-grid">
    <div class="card stat-card"><div class="label">Classes</div><div class="value">1</div></div>
    <div class="card stat-card"><div class="label">Assessments</div><div class="value">1</div></div>
    <div class="card stat-card"><div class="label">Incomplete</div><div class="value">1</div></div>
  </div>
  <div class="card"><h2>Recent assessments</h2>
    <div style="display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)">
      <span>Mathematics Test 1</span><span class="label">38 / 40 completed</span>
    </div>
  </div>
  `
}

// ORDER 15,30: MARK ENTRY - MOST IMPORTANT SCREEN
let markState = {...DB.marks.reduce((acc,m)=>({...acc,[m.student_id]:m.mark}),{})}
function MarkEntry(){
  const assessment = DB.assessments[0]
  const students = DB.students.filter(s=>s.class_id===assessment.class_id)
  const completed = students.filter(s=>markState[s.id]!==undefined && markState[s.id]!=='').length
  return `
  <h1>← Marks</h1>
  <p class="label">${DB.classes[0].name} | ${DB.subjects[0].name}</p>
  <h2>${assessment.name}</h2>
  <p class="label">Maximum mark: ${assessment.maximum_mark}</p>
  <p style="margin:16px 0">${completed} of ${students.length} students completed</p>
  
  <div class="table-wrap">
    <table>
      <thead><tr><th>Student</th><th>Mark</th><th>Status</th></tr></thead>
      <tbody>
        ${students.map(s=>`
          <tr>
            <td>${s.name}</td>
            <td><input class="mark-input" type="number" value="${markState[s.id]||''}" 
              onkeydown="if(event.key==='Tab'){event.preventDefault(); focusNext(this)}"
              oninput="validateMark(this,${s.id},${assessment.maximum_mark})"></td>
            <td class="status ${markState[s.id]!==undefined&&markState[s.id]!==''?'saved':'missing'}">
              ${markState[s.id]!==undefined&&markState[s.id]!==''?'✓ Saved':'! Missing'}
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  </div>
  <button class="btn" style="margin-top:16px" onclick="saveMarks()">Save Changes</button>
  <div id="feedback" class="feedback"></div>
  `
}

// ORDER 17,18: VALIDATION + SAVE
function validateMark(input, studentId, max){
  const val = input.value
  if(val!=='' && (Number(val)<0 || Number(val)>max)){
    showFeedback(`Maximum mark is ${max}`, 'danger')
    input.value=''
    return
  }
  markState[studentId]=val
  route('marks') // re-render to update status
}
function saveMarks(){
  // ORDER 18: Save + Audit
  Object.keys(markState).forEach(sid=>{
    const oldMark = DB.marks.find(m=>m.student_id==sid)?.mark
    if(oldMark!=markState[sid]){
      DB.audit.push({
        student_id:sid, old_mark:oldMark, new_mark:markState[sid], 
        changed_by:DB.user.name, changed_at:new Date().toLocaleString()
      })
    }
  })
  showFeedback('✓ Marks saved successfully', 'success')
}
function showFeedback(msg, type){
  const el = document.getElementById('feedback')
  el.style.color = type==='success'? 'var(--success)' : 'var(--danger)'
  el.innerText = msg
  setTimeout(()=>el.innerText='',3000)
}

// ORDER 31: ADMIN TABLES
function StudentsTable(){
  return `
  <div class="table-header">
    <h1>Students</h1>
    <button class="btn">+ Add Student</button>
  </div>
  <div class="card" style="margin-bottom:16px;display:flex;gap:12px">
    <input class="input" placeholder="Search students...">
    <select class="input" style="width:200px"><option>All Classes</option></select>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Name</th><th>Class</th><th>Status</th><th>Actions</th></tr></thead>
      <tbody>
        ${DB.students.map(s=>`
          <tr>
            <td>${s.name}</td>
            <td>${DB.classes.find(c=>c.id===s.class_id).name}</td>
            <td>${s.active?'Active':'Inactive'}</td>
            <td>⋮</td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  </div>
  `
}

function AssessmentsTable(){
  return `<h1>Assessments</h1><div class="card"><p>Create assessment form goes here</p></div>`
}

// ORDER 20: AUDIT HISTORY
function AuditHistory(){
  return `
  <h1>Mark History</h1>
  <div class="table-wrap">
    <table>
      <thead><tr><th>Assessment</th><th>Student</th><th>Change</th><th>Changed By</th><th>Date</th></tr></thead>
      <tbody>
        ${DB.audit.map(a=>`
          <tr>
            <td>Mathematics Test 1</td>
            <td>${DB.students.find(s=>s.id==a.student_id).name}</td>
            <td>${a.old_mark||'-'} → ${a.new_mark}</td>
            <td>${a.changed_by}</td>
            <td class="label">${a.changed_at}</td>
          </tr>
        `).join('') || '<tr><td colspan="5">No changes yet</td></tr>'}
      </tbody>
    </table>
  </div>
  `
}

function focusNext(current){
  const inputs = [...document.querySelectorAll('.mark-input')]
  const idx = inputs.indexOf(current)
  if(inputs[idx+1]) inputs[idx+1].focus() // ORDER 16: TAB SPEED
}
</script>
</body>
</html>
